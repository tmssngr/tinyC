; CFG for function next
; block next
	; predecessors=[]
		1: global
	; 14 pc
	move copy, global
		2: copy, global
	add global, global, 1
		1: copy
	; 8:9 return copy
	ret copy
	jump next_ret
	; successors=[next_ret]

; block next_ret
	; predecessors=[next]
	; successors=[]


; CFG for function main
; block main
	; predecessors=[]
	; 3 pc
	; begin initialize global variables
	const global, 0
	; end initialize global variables
	; 12:2 while true
	jump while_1
	; successors=[while_1]

; block if_2_end
	; predecessors=[while_1]
		1: n
	; 4 pc
	branch n gteq 2: main.no_critical_edge_5, if_3_then
	jump if_3_then
	; successors=[main.no_critical_edge_5, if_3_then]

; block main.no_critical_edge_5
	; predecessors=[if_2_end]
	; 1 pc
	jump while_1
	; successors=[while_1]

; block if_3_then
	; predecessors=[if_2_end]
	; 7 pc
	const t.2, [string-1]
		1: t.2
	call printString@@u8[t.2]
	jump while_1
	; successors=[while_1]

; block while_1
	; predecessors=[main, main.no_critical_edge_5, if_3_then]
	; 13 pc
	const t.1, [string-0]
		1: t.1
	call printString@@u8[t.1]
	call n = next[] -> u8
		1: n
	; 15:3 if n == 3
	branch n equals 3: main_ret, if_2_end
		1: n
	jump if_2_end
		1: n
	; successors=[main_ret, if_2_end]

; block main_ret
	; predecessors=[while_1]
	; successors=[]


