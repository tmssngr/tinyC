; CFG for function next
; block next
	; predecessors=[]
		1: global
	; 47 pc
	addrof a.1, global
		2: a.1, global
	load copy, [a.1]
		2: copy, global
	addrof a.3, global
		3: a.3, copy, global
	load t.4, [a.3]
		3: copy, global, t.4
	move t.2, t.4
		3: copy, global, t.2
	add t.2, 1
		3: copy, global, t.2
	addrof a.5, global
		3: a.5, copy, t.2
	store [a.5], t.2
		1: copy
	; 8:9 return copy
	ret copy
	jump next_ret
	; successors=[next_ret]

; block next_ret
	; predecessors=[next]
	; successors=[]


; CFG for function main
; block main
	; predecessors=[]
		1: global
	; 14 pc
	; begin initialize global variables
	const t.1, 0
		2: global, t.1
	addrof a.2, global
		2: a.2, t.1
	store [a.2], t.1
	; end initialize global variables
	; 12:2 while true
	jump while_1
	; successors=[while_1]

; block if_2_end
	; predecessors=[while_1]
		1: n
	; 4 pc
	branch n gteq 2: main.no_critical_edge_5, if_3_then
	jump if_3_then
	; successors=[main.no_critical_edge_5, if_3_then]

; block main.no_critical_edge_5
	; predecessors=[if_2_end]
	; 1 pc
	jump while_1
	; successors=[while_1]

; block if_3_then
	; predecessors=[if_2_end]
	; 7 pc
	const t.4, [string-1]
		1: t.4
	call printString@@u8[t.4]
	jump while_1
	; successors=[while_1]

; block while_1
	; predecessors=[main, main.no_critical_edge_5, if_3_then]
	; 13 pc
	const t.3, [string-0]
		1: t.3
	call printString@@u8[t.3]
	call n = next[] -> u8
		1: n
	; 15:3 if n == 3
	branch n equals 3: main_ret, if_2_end
		1: n
	jump if_2_end
		1: n
	; successors=[main_ret, if_2_end]

